name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  claude:
    if: contains(github.event.comment.body, '@claude')
    runs-on: ubuntu-latest
    steps:
      - uses: anthropics/claude-code-action@d70510b174a1244958df0b03166a54912811f3e6
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
