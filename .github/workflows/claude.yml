name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  claude:
    if: contains(github.event.comment.body, '@claude')
    runs-on: ubuntu-latest
    steps:
      - uses: anthropics/claude-code-action@d40ddef4c030e508327d6e35a9c45f3368482c50
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
