name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  claude:
    if: contains(github.event.comment.body, '@claude')
    runs-on: ubuntu-latest
    steps:
      - uses: anthropics/claude-code-action@eb56b6666facdbd501035f4a0269d8caee2e7a8b
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
