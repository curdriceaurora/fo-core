name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  claude:
    if: contains(github.event.comment.body, '@claude')
    runs-on: ubuntu-latest
    steps:
      - uses: anthropics/claude-code-action@1f291e1cfe0f5fc21db2aef19af844591600ade7
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
